name: Build Cross-Platform Releases (Windows & Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: screen-overlay-translator-windows-x64
          - platform: ubuntu-22.04
            artifact_name: screen-overlay-translator-linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend CLI dependencies
        run: npm ci

      - name: Build Tauri bundles (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build

      - name: Build Tauri bundles (Linux)
        if: runner.os == 'Linux'
        run: npx tauri build --bundles deb

      - name: Stage Windows artifacts (portable .exe + .msi + NSIS setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          Copy-Item "src-tauri/target/release/screen-overlay-translator.exe" "release_assets/screen-overlay-translator-portable-windows-x64.exe"
          Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination release_assets/
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination release_assets/

      - name: Stage Linux artifacts (.deb + .AppImage + binary)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release_assets
          cp src-tauri/target/release/screen-overlay-translator release_assets/screen-overlay-translator-linux-x64
          cp src-tauri/target/release/bundle/deb/*.deb release_assets/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage release_assets/ 2>/dev/null || true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/*

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
